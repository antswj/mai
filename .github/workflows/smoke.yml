name: Mai Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    # macos-26 (Xcode 27) is the toolchain this project targets: the Liquid Glass layer
    # needs the macOS 26 SDK to compile its real path rather than the fallback. Design.swift
    # still guards those APIs at compile time, so older toolchains build the fallback.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Acceptance harness
        run: swift run MaiTests

      - name: Golden traces
        run: swift run MaiSmoke golden

      - name: Fast soak
        run: swift run MaiSmoke soak 30

      - name: Latency budgets
        run: swift run MaiSmoke budget

      - name: Provider health
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' }}
        run: swift run MaiSmoke health
